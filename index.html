  <!-- CENTERPIECE: UNIFIED IN-PLACE INTERACTIVE BOOK (HUMBLE PIXEL POCKET INVENTORY STYLE) -->
  <div id="envelope-stage" class="book-stage">
    
    <div id="interactive-book" class="vintage-book-container closed">
      
      <!-- Authentic Humble Pixel Book Surface (Animates frame_0 -> frame_1 -> frame_2 -> frame_3 directly in place) -->
      <img id="book-surface-img" class="book-surface-img" src="./assets/book/open/frame_0.png" alt="Книга" />

      <!-- Minimalist Hint Below Book -->
      <div id="book-click-hint" class="book-tag-hint">КЛИКНИ, ЧТОБЫ ОТКРЫТЬ КНИГУ</div>

      <!-- Book Spread Interactive Content (Revealed on the open pages) -->
      <div id="greeting-card-booklet" class="book-spread-content hidden">
        
        <!-- Minimal Close Button in top corner -->
        <button id="close-game-btn" class="card-close-btn" title="Закрыть книгу">✕</button>

        <!-- PAGE 1: WORLD VIEW (SARANSK & MOSCOW PIXEL ADVENTURE) -->
        <div class="booklet-page-container" id="booklet-game-page">
          <canvas id="pixel-canvas" width="480" height="270"></canvas>
        </div>

        <!-- PAGE 2: IN-FLIGHT SEQUENCE REVEALED ON PAGE FLIP -->
        <div class="flight-page-container hidden" id="flight-page-container">
          <canvas id="flight-canvas" width="480" height="270"></canvas>
        </div>

        <!-- AUTHENTIC HUMBLE PIXEL PAGE FLIP ANIMATION PLAYER -->
        <img id="book-page-flip-player" class="book-page-flip-player hidden" src="./assets/book/flip/frame_0.png" alt="Page Flip" />

      </div>

    </div>

  </div>

  <!-- RETRO WINAMP AUDIO PLAYER (CUTE PINK & WHITE) -->
  <div id="winamp-player" class="winamp-box">
    <div class="winamp-titlebar">
      <span>♫ AUDIO</span>
      <button id="winamp-toggle" class="win-btn">_</button>
    </div>
    <div class="winamp-display">
      <div class="winamp-visualizer">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </div>
    </div>
    <div class="winamp-controls">
      <button id="audio-play" class="winamp-btn">▶</button>
      <div class="volume-slider-box">
        <input type="range" id="audio-volume" min="0" max="1" step="0.05" value="0.20" />
      </div>
    </div>
  </div>

  <!-- ZERO-G COSMIC LEAP OVERLAY STAGE -->
  <div id="cosmic-stage" class="cosmic-stage hidden">
    <canvas id="cosmic-canvas"></canvas>
  </div>

  <!-- GRAND 26-CANDLE BIRTHDAY CAKE FINALE STAGE -->
  <div id="grand-cake-stage" class="grand-cake-stage hidden">
    <canvas id="grand-cake-canvas"></canvas>
    <div id="cake-ui-overlay" class="cake-ui-overlay">
      <div id="cake-celebration-banner" class="cake-celebration-banner hidden">
        <div class="celebration-title">С ДНЁМ РОЖДЕНИЯ<span class="pixel-excl">!</span></div>
      </div>
    </div>
  </div>

  <!-- RETRO Y2K MOBILE TOUCH CONTROLS -->
  <div id="mobile-touch-controls" class="mobile-touch-controls hidden">
    <div class="touch-group touch-left-group">
      <button id="touch-left" class="touch-btn touch-btn-dir" aria-label="Влево">◄</button>
      <button id="touch-right" class="touch-btn touch-btn-dir" aria-label="Вправо">►</button>
    </div>
    <div class="touch-group touch-right-group">
      <button id="touch-jump" class="touch-btn touch-btn-action" aria-label="Прыжок">▲</button>
      <button id="touch-action" class="touch-btn touch-btn-action touch-btn-f" aria-label="Действие">F</button>
    </div>
  </div>

  <!-- CAMERA FLASH OVERLAY & POLAROID SNAPSHOT STAGE -->
  <div id="camera-flash-overlay" class="camera-flash-overlay"></div>
  <div id="polaroid-snapshot-container" class="polaroid-snapshot-container"></div>

  <script type="module" src="./src/main.js?v=20260920_2000"></script>
